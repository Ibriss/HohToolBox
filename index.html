<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Uni Hohenheim – Meine Tools</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0b6b3a">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#f4f5f7;--card:#fff;--text:#14181f;--muted:#5d6675;--accent:#0b6b3a;--border:#e1e4ea;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101319;--card:#1a1f28;--text:#eef0f4;--muted:#9aa4b4;--accent:#4cc28a;--border:#2a313d}}
:root[data-theme="dark"]{--bg:#101319;--card:#1a1f28;--text:#eef0f4;--muted:#9aa4b4;--accent:#4cc28a;--border:#2a313d}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
main{max-width:560px;margin:0 auto;padding:20px 16px 32px}
h1{font-size:1.4rem;margin:8px 0 2px}
.sub{color:var(--muted);margin:0 0 20px;font-size:.95rem}
h2{font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:26px 0 10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{display:flex;flex-direction:column;gap:6px;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;text-decoration:none;color:inherit;min-height:112px}
.tile:active{transform:scale(.97);border-color:var(--accent)}
.tile .ic{font-size:1.8rem;line-height:1}
.tile b{font-size:1.05rem}
.tile span.d{font-size:.82rem;color:var(--muted)}
.list{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 14px;text-decoration:none;color:inherit}
.row:active{border-color:var(--accent)}
.row .ic{font-size:1.3rem}
.row small{display:block;color:var(--muted);font-size:.8rem}
footer{margin-top:28px;color:var(--muted);font-size:.8rem;text-align:center}
</style>
</head>
<body>
<main>
<h1>Meine Uni-Tools</h1>
<p class="sub">Universität Hohenheim · Schnellzugriff</p>
<div class="grid" id="core"></div>
<h2>Weitere Links</h2>
<div class="list" id="more"></div>
<footer>Tipp: In Chrome Menü ⋮ → „Zum Startbildschirm hinzufügen“</footer>
</main>
<script>
// Hier Links anpassen: [Icon, Name, Beschreibung, URL]
var CORE=[
["🎓","HohCampus","Stundenplan, Module, Prüfungen","https://hohcampus.verw.uni-hohenheim.de/qisserver/pages/cs/sys/portal/hisinoneStartPage.faces"],
["📚","ILIAS","Kursmaterial & Lernplattform","https://ilias.uni-hohenheim.de/login.php?client_id=UHOH&lang=de"],
["🧩","F.I.T.","Weiterbildungsplattform","https://weiterbildung.uni-hohenheim.de"],
["🔎","HohSearch","Bibliothekskatalog","https://rds-hoh.ibs-bw.de/hohsearch/"],
["🤖","GPTalk","Uni-interner KI-Chat","https://gptalk.uni-hohenheim.de/"]
];
var MORE=[
["🍽️","Mensa Hohenheim","Speiseplan","https://www.my-stuwe.de/mensa/mensa-hohenheim/"],
["✉️","Webmail","Uni-E-Mail","https://webmail.uni-hohenheim.de"],
["👤","Hohenheimer Benutzerkonto","Profil & Passwort","https://idm.uni-hohenheim.de/profile"],
["📅","Semestertermine","Vorlesungszeiten & Fristen","https://www.uni-hohenheim.de/semestertermine"],
["📝","Prüfungsamt","Formulare & Fristen","https://www.uni-hohenheim.de/pruefung"],
["🗂️","Studienplan","Studienunterlagen","https://www.uni-hohenheim.de/studienplan"],
["🛟","KIM IT-Hilfe","Anleitungen, VPN, eduroam","https://kim.uni-hohenheim.de"]
];
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;")}
document.getElementById("core").innerHTML=CORE.map(function(t){
return '<a class="tile" href="'+t[3]+'" target="_blank" rel="noopener"><span class="ic">'+t[0]+'</span><b>'+esc(t[1])+'</b><span class="d">'+esc(t[2])+'</span></a>'}).join("");
document.getElementById("more").innerHTML=MORE.map(function(t){
return '<a class="row" href="'+t[3]+'" target="_blank" rel="noopener"><span class="ic">'+t[0]+'</span><div><b>'+esc(t[1])+'</b><small>'+esc(t[2])+'</small></div></a>'}).join("");
if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}
</script>
</body>
</html>
