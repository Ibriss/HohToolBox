<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HohToolBox</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101319" media="(prefers-color-scheme: dark)">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#f4f5f7;--card:#fff;--text:#14181f;--muted:#5d6675;--accent:#0b6b3a;--border:#e1e4ea;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101319;--card:#1a1f28;--text:#eef0f4;--muted:#9aa4b4;--accent:#4cc28a;--border:#2a313d}}
:root[data-theme="dark"]{--bg:#101319;--card:#1a1f28;--text:#eef0f4;--muted:#9aa4b4;--accent:#4cc28a;--border:#2a313d}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
main{max-width:560px;margin:0 auto;padding:20px 16px 32px}
.hd{display:flex;align-items:center;gap:14px;margin:6px 0 22px}
.logo{width:56px;height:56px;flex:none;border-radius:14px;box-shadow:0 2px 8px rgba(0,0,0,.18)}
h1{font-size:1.5rem;margin:0 0 2px}
.sub{color:var(--muted);margin:0;font-size:.92rem}
h2{font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:26px 0 10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{display:flex;flex-direction:column;gap:6px;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;text-decoration:none;color:inherit;min-height:112px}
.tile:active{transform:scale(.97);border-color:var(--accent)}
.tile .ic{font-size:1.8rem;line-height:1}
.tile b{font-size:1.05rem}
.tile span.d{font-size:.82rem;color:var(--muted)}
.list{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 14px;text-decoration:none;color:inherit}
.row:active{border-color:var(--accent)}
.row .ic{font-size:1.3rem}
.row small{display:block;color:var(--muted);font-size:.8rem}
footer{margin-top:28px;color:var(--muted);font-size:.8rem;text-align:center}
</style>
</head>
<body>
<main>
<header class="hd"><svg class="logo" viewBox="0 0 512 512" aria-hidden="true">
<defs>
<linearGradient id="lbg" x1="0" y1="0" x2="0.4" y2="1"><stop offset="0" stop-color="#14a35c"/><stop offset="1" stop-color="#05492a"/></linearGradient>
<radialGradient id="lglow" cx="0.3" cy="0.2" r="0.8"><stop offset="0" stop-color="#fff" stop-opacity=".22"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<linearGradient id="lbody" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#d9eadf"/></linearGradient>
<linearGradient id="lgold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd24d"/><stop offset="1" stop-color="#f0a916"/></linearGradient>
</defs>
<rect width="512" height="512" rx="112" fill="url(#lbg)"/>
<rect width="512" height="512" rx="112" fill="url(#lglow)"/>
<path d="M190 180V150Q190 120 220 120H292Q322 120 322 150V180" fill="none" stroke="#fff" stroke-width="24" stroke-linecap="round"/>
<rect x="110" y="168" width="292" height="206" rx="36" fill="#000" opacity=".22" transform="translate(0 8)"/>
<rect x="110" y="168" width="292" height="206" rx="36" fill="url(#lbody)"/>
<rect x="110" y="230" width="292" height="20" fill="url(#lgold)"/>
<rect x="224" y="212" width="64" height="56" rx="14" fill="#07522d"/>
<circle cx="256" cy="240" r="9" fill="#ffd24d"/>
<g fill="#07522d"><rect x="192" y="284" width="32" height="68" rx="2"/><rect x="288" y="284" width="32" height="68" rx="2"/><rect x="192" y="306" width="128" height="24" rx="2"/></g>
</svg><div><h1>HohToolBox</h1>
<p class="sub">Universität Hohenheim · Schnellzugriff</p></div></header>
<div class="grid" id="core"></div>
<h2>Weitere Links</h2>
<div class="list" id="more"></div>
<footer>Tipp: In Chrome Menü ⋮ → „Zum Startbildschirm hinzufügen“</footer>
</main>
<script>
// Hier Links anpassen: [Icon, Name, Beschreibung, URL]
var CORE=[
["🎓","HohCampus","Stundenplan, Module, Prüfungen","https://hohcampus.verw.uni-hohenheim.de/qisserver/pages/cs/sys/portal/hisinoneStartPage.faces"],
["📚","ILIAS","Kursmaterial & Lernplattform","https://ilias.uni-hohenheim.de/login.php?client_id=UHOH&lang=de"],
["🧩","F.I.T.","Weiterbildungsplattform","https://weiterbildung.uni-hohenheim.de"],
["🔎","HohSearch","Bibliothekskatalog","https://rds-hoh.ibs-bw.de/hohsearch/"],
["🤖","GPTalk","Uni-interner KI-Chat","https://gptalk.uni-hohenheim.de/"],
["📝","Notizen","Eigene Notizen, auch offline","notes.html"]
];
var MORE=[
["🍽️","Mensa Hohenheim","Speiseplan","https://www.my-stuwe.de/mensa/mensa-hohenheim/"],
["✉️","Webmail","Uni-E-Mail","https://webmail.uni-hohenheim.de"],
["👤","Hohenheimer Benutzerkonto","Profil & Passwort","https://idm.uni-hohenheim.de/profile"],
["📅","Semestertermine","Vorlesungszeiten & Fristen","https://www.uni-hohenheim.de/semestertermine"],
["📝","Prüfungsamt","Formulare & Fristen","https://www.uni-hohenheim.de/pruefung"],
["🗂️","Studienplan","Studienunterlagen","https://www.uni-hohenheim.de/studienplan"],
["🛟","KIM IT-Hilfe","Anleitungen, VPN, eduroam","https://kim.uni-hohenheim.de"]
];
function tg(u){return /^https?:/.test(u)?' target="_blank" rel="noopener"':""}
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;")}
document.getElementById("core").innerHTML=CORE.map(function(t){
return '<a class="tile" href="'+t[3]+'"'+tg(t[3])+'><span class="ic">'+t[0]+'</span><b>'+esc(t[1])+'</b><span class="d">'+esc(t[2])+'</span></a>'}).join("");
document.getElementById("more").innerHTML=MORE.map(function(t){
return '<a class="row" href="'+t[3]+'"'+tg(t[3])+'><span class="ic">'+t[0]+'</span><div><b>'+esc(t[1])+'</b><small>'+esc(t[2])+'</small></div></a>'}).join("");
if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}
</script>
</body>
</html>
