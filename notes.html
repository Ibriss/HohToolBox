<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Notizen · HohToolBox</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0b6b3a">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#f4f5f7;--card:#fff;--text:#14181f;--muted:#5d6675;--accent:#0b6b3a;--border:#e1e4ea;--danger:#c0392b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101319;--card:#1a1f28;--text:#eef0f4;--muted:#9aa4b4;--accent:#4cc28a;--border:#2a313d;--danger:#ff7b6b}}
:root[data-theme="dark"]{--bg:#101319;--card:#1a1f28;--text:#eef0f4;--muted:#9aa4b4;--accent:#4cc28a;--border:#2a313d;--danger:#ff7b6b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
main{max-width:560px;margin:0 auto;padding:16px 16px 32px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.top h1{font-size:1.4rem;margin:0}
a.back,button{font:inherit;color:var(--accent);background:none;border:0;padding:8px 4px;cursor:pointer;text-decoration:none}
button.primary{background:var(--accent);color:var(--bg);border-radius:12px;padding:10px 16px;font-weight:600}
button.danger{color:var(--danger)}
input,textarea{width:100%;font:inherit;font-size:16px;color:var(--text);background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 14px;outline:none}
input:focus,textarea:focus{border-color:var(--accent)}
textarea{min-height:60vh;resize:vertical;line-height:1.45;margin-top:10px}
#title{font-weight:600;font-size:1.1rem}
.bar{display:flex;gap:10px;margin:12px 0}
.bar input{flex:1}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 14px;color:var(--text)}
.item:active{border-color:var(--accent)}
.item b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item small{display:block;color:var(--muted);font-size:.8rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.empty{color:var(--muted);text-align:center;padding:30px 0}
.status{color:var(--muted);font-size:.8rem;text-align:right;margin-top:6px;min-height:1em}
.foot{display:flex;justify-content:center;gap:18px;margin-top:22px;font-size:.85rem}
.foot button{color:var(--muted)}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
<section id="vList">
 <div class="top"><div><a class="back" href="./">← Start</a></div><h1>Notizen</h1><button class="primary" id="new">+ Neu</button></div>
 <div class="bar"><input id="q" type="search" placeholder="Suchen…" autocomplete="off"></div>
 <div class="list" id="list"></div>
 <div class="foot"><button id="exp">Exportieren</button><button id="imp">Importieren</button><input type="file" id="file" accept=".json,application/json" hidden></div>
</section>
<section id="vEdit" hidden>
 <div class="top"><a class="back" href="#">← Alle Notizen</a><button class="danger" id="del">Löschen</button></div>
 <input id="title" placeholder="Titel" autocomplete="off">
 <textarea id="text" placeholder="Notiz schreiben…"></textarea>
 <div class="status" id="st"></div>
</section>
</main>
<script>
var KEY="hohtoolbox-notes-v1",notes=[],cur=null,timer=null;
var $=function(id){return document.getElementById(id)};
function load(){try{notes=JSON.parse(localStorage.getItem(KEY)||"[]");if(!Array.isArray(notes))notes=[]}catch(e){notes=[]}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(notes));return true}catch(e){return false}}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function fmt(t){return new Date(t).toLocaleString("de-DE",{day:"2-digit",month:"2-digit",year:"2-digit",hour:"2-digit",minute:"2-digit"})}
function find(id){for(var i=0;i<notes.length;i++)if(notes[i].id===id)return notes[i];return null}
function renderList(){
 var q=$("q").value.trim().toLowerCase();
 var arr=notes.filter(function(n){return !q||(n.title+" "+n.text).toLowerCase().indexOf(q)>-1}).sort(function(a,b){return b.updated-a.updated});
 $("list").innerHTML=arr.length?arr.map(function(n){
  var prev=n.text.replace(/\s+/g," ").trim();
  return '<button class="item" data-id="'+esc(n.id)+'"><b>'+esc(n.title||"Ohne Titel")+'</b><small>'+esc(fmt(n.updated)+(prev?" · "+prev:""))+'</small></button>'}).join("")
  :'<div class="empty">'+(q?"Nichts gefunden.":"Noch keine Notizen. Tippe auf „+ Neu“.")+'</div>';
}
function route(){
 if(location.hash==="#new"){location.replace("#n-"+mk().id);return}
 var h=location.hash.slice(1),n=h.indexOf("n-")===0?find(h.slice(2)):null;
 if(cur&&cur!==n)flush();
 if(n){cur=n;$("vList").hidden=true;$("vEdit").hidden=false;$("title").value=n.title;$("text").value=n.text;$("st").textContent="";if(!n.title&&!n.text)$("title").focus()}
 else{cur=null;$("vEdit").hidden=true;$("vList").hidden=false;renderList()}
}
function flush(){
 clearTimeout(timer);
 if(!cur)return;
 if(!cur.title&&!cur.text){notes=notes.filter(function(n){return n!==cur})}
 save();
}
function touch(){
 if(!cur)return;
 cur.title=$("title").value;cur.text=$("text").value;cur.updated=Date.now();
 $("st").textContent="Speichert…";
 clearTimeout(timer);
 timer=setTimeout(function(){$("st").textContent=save()?"Gespeichert":"Speichern fehlgeschlagen (Speicher voll oder blockiert)"},300);
}
function mk(){var n={id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),title:"",text:"",updated:Date.now()};notes.push(n);return n}
$("new").onclick=function(){location.hash="n-"+mk().id};
$("list").onclick=function(e){var b=e.target.closest(".item");if(b)location.hash="n-"+b.getAttribute("data-id")};
$("q").oninput=renderList;
$("title").oninput=touch;$("text").oninput=touch;
$("del").onclick=function(){if(cur&&confirm("Diese Notiz löschen?")){var c=cur;cur=null;notes=notes.filter(function(n){return n!==c});save();location.hash=""}};
$("exp").onclick=function(){
 var blob=new Blob([JSON.stringify(notes,null,2)],{type:"application/json"}),a=document.createElement("a");
 a.href=URL.createObjectURL(blob);a.download="hohtoolbox-notizen-"+new Date().toISOString().slice(0,10)+".json";
 document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(a.href)},2000);
};
$("imp").onclick=function(){$("file").click()};
$("file").onchange=function(){
 var f=this.files[0];if(!f)return;
 var r=new FileReader();
 r.onload=function(){
  try{
   var d=JSON.parse(r.result),added=0;
   if(!Array.isArray(d))throw 0;
   d.forEach(function(n){if(n&&typeof n.id==="string"&&!find(n.id)){notes.push({id:n.id,title:String(n.title||""),text:String(n.text||""),updated:+n.updated||Date.now()});added++}});
   save();renderList();alert(added+" Notiz(en) importiert.");
  }catch(e){alert("Datei konnte nicht gelesen werden.")}
 };
 r.readAsText(f);this.value="";
};
window.addEventListener("hashchange",route);
window.addEventListener("pagehide",flush);
document.addEventListener("visibilitychange",function(){if(document.hidden)flush()});
load();route();
if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}
</script>
</body>
</html>
